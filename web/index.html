<script>
    // BLOCK ALL POPUPS AND REDIRECTS WITHOUT USING SANDBOX
    (function() {
      // 1. Block window.open (popup ads)
      const originalOpen = window.open;
      window.open = function(...args) {
        console.warn("[Ad Blocker] Blocked window.open:", args[0]);
        // Return a dummy window object to avoid JS errors
        return { closed: true, close: function() {}, focus: function() {} };
      };

      // 2. Block location.replace and location.assign
      window.location.replace = function(url) {
        console.warn("[Ad Blocker] Blocked location.replace:", url);
        // Do nothing
      };
      window.location.assign = function(url) {
        console.warn("[Ad Blocker] Blocked location.assign:", url);
      };

      // 3. Prevent setting window.location.href (only if it's a full navigation)
      // We override the property descriptor
      let originalHref = window.location.href;
      Object.defineProperty(window.location, 'href', {
        get: function() { return originalHref; },
        set: function(value) {
          console.warn("[Ad Blocker] Blocked setting location.href to:", value);
          // Do not actually navigate
        }
      });

      // 4. Block click events on links that try to navigate
      document.addEventListener('click', function(e) {
        let target = e.target;
        while (target && target !== document) {
          if (target.tagName === 'A' && target.href) {
            const href = target.href;
            // Allow only same-origin or hash links? Better to block all external?
            // For movie ads, they usually point to external ad sites.
            if (!href.startsWith(window.location.origin) &&
                !href.startsWith('#') &&
                !href.startsWith('javascript:')) {
              console.warn("[Ad Blocker] Blocked link click:", href);
              e.preventDefault();
              e.stopPropagation();
              return false;
            }
          }
          target = target.parentElement;
        }
      }, true);

      // 5. Prevent beforeunload (optional: warn user)
      window.addEventListener('beforeunload', function(e) {
        // If an ad tries to unload the page, this gives user a chance to stay
        e.preventDefault();
        e.returnValue = 'An ad tried to leave this page. Do you want to stay?';
      });

      console.log("[Ad Blocker] Active – popups and redirects blocked");
    })();
</script>
<script>
    class DivPlaceholder extends HTMLElement {
      connectedCallback() {
        // Create a container div
        this.innerHTML = '<div id="videasy-container" style="width:100%; height:100%;"></div>';
        const src = this.getAttribute('data-src');
        if (src) this._createIframe(src);
      }

      static get observedAttributes() { return ['data-src']; }

      attributeChangedCallback(name, oldValue, newValue) {
        if (name === 'data-src' && newValue) {
          this._createIframe(newValue);
        }
      }

      _createIframe(src) {
        const container = this.querySelector('#videasy-container');
        if (container) {
          container.innerHTML = `
            <iframe src="${src}"
                    style="width:100%; height:100%; border:none;"
                    allowfullscreen>
            </iframe>
          `;
        }
      }
    }
    customElements.define('div-placeholder', DivPlaceholder);
</script>

<!-- Custom element for Videasy iframe without sandbox -->
<script>
    class VideasyPlayer extends HTMLElement {
   // ... (other methods unchanged) ...

   _createIframe(src) {
     const iframe = document.createElement('iframe');
     iframe.src = src;
     iframe.style.width = '100%';
     iframe.style.height = '100%';
     iframe.style.border = 'none';
     iframe.allowFullscreen = true;

     // Add the most restrictive sandbox that still allows video to work
     // ⚠️ Remove 'allow-popups' and 'allow-top-navigation' entirely
     // 'allow-same-origin' is often needed for video streaming cookies
     // 'allow-scripts' is required for the player's JavaScript
     // 'allow-presentation' allows fullscreen presentation API
     iframe.sandbox = 'allow-scripts allow-same-origin allow-presentation';

     // Also try to limit which permissions are granted via the 'allow' attribute
     iframe.allow = 'autoplay; fullscreen; encrypted-media';

     this.shadowRoot.appendChild(iframe);
   }
 }
</script>
